[workspace]
members = [
    "apps/watchmind-api",
    "apps/watchmind-cli",
    "crates/infrastructure",
    "crates/recommendation",
]
resolver = "3"

[workspace.dependencies]
# `float_roundtrip` garantit qu'un f64 sérialisé puis relu revient bit à bit.
# Sans elle, un score dont la représentation courte demande dix-sept chiffres
# est relu à un ULP près : les explications historiques cessent d'être égales à
# celles qui ont été calculées, et l'API versionne un profil identique.
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
