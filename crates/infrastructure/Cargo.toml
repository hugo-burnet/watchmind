[package]
name = "watchmind-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "rt-multi-thread"] }
watchmind-recommendation = { path = "../recommendation" }

[dev-dependencies]
tempfile = "3.20"
tokio = { version = "1.0", features = ["fs", "macros", "rt-multi-thread"] }

[lints]
workspace = true
